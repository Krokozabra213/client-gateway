  services:
    api:
      profiles:
        - prod
      container_name: client-gateway-api
      build:
        context: .
        dockerfile: dev.Dockerfile
      restart: always
      env_file:
        - .env
      ports:
        - "4000:4000"
      depends_on:
        postgres:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully
        redis:
          condition: service_healthy
        otel-collector:
          condition: service_started


    postgres:
      profiles:
        - prod
      image: postgres:16-alpine
      container_name: client-gateway-db
      restart: always
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: client-gateway
      ports:
        - "5433:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5

    redis:
      profiles:
        - prod
      image: redis:8.6-alpine
      container_name: client-gateway-redis
      restart: always
      ports:
        - "6380:6379"
      volumes:
        - redis_data:/data
      command: ["redis-server", "--appendonly", "yes"]
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

    otel-collector:
      profiles:
        - prod
      image: otel/opentelemetry-collector-contrib:0.149.0
      container_name: otel-collector
      command: [ "--config=/etc/otel-collector.yaml" ]
      volumes:
        - ./otel-collector.yaml:/etc/otel-collector.yaml
      ports:
        - "4317:4317"
      # depends_on:
