    test-postgres:
      profiles:
      - test
      image: postgres:16-alpine
      container_name: test-client-gateway-db
      environment:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
      ports:
        - "5432:5432"
      volumes:
        - test_pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5
      restart: "no"

    migrate:
      profiles:
        - prod
      container_name: client-gateway-migrate
      build:
        context: .
        dockerfile: Migrate.Dockerfile
      environment:
        GOOSE_DBSTRING: "postgres://postgres:postgres@postgres:5432/client-gateway?sslmode=disable"
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"

  volumes:
    test_pg_data:
    pg_data:
    redis_data:
    # vmdata:
