name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Build
        run: go build -o client-gateway ./cmd/client-gateway

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Start test containers
        run: make docker-test-up

      - name: Wait for Postgres
        run: |
          docker compose ps
          until docker compose exec -T test-postgres pg_isready -U postgres > /dev/null 2>&1; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Run tests
        run: make test

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test containers
        if: always()
        run: make docker-test-down

      - name: Build
        run: go build -o client-gateway ./cmd/client-gateway
